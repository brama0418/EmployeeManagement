<!DOCTYPE html>
<html>
<head>
    <title>Increase Decrease</title>
</head>
<body>

    <h2>Counter</h2>

    <h1 id="count">0</h1>

    <button onclick="decrease()">Decrease</button>
    <button onclick="increase()">Increase</button>

    <script>
        let count = 0;

        function increase() {
            count++;
            document.getElementById("count").innerText = count;
        }

        function decrease() {
            count--;
            document.getElementById("count").innerText = count;
        }
    </script>

</body>
</html>
